services:
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      BUCKET: heavy-files
      OBJECT: photo_visokogo_razresheniya.jpg
    volumes:
      - ./asset/photo_visokogo_razresheniya.jpg:/asset/photo_visokogo_razresheniya.jpg:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then
            echo "MinIO is not ready" >&2
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing "local/$$BUCKET"
        mc cp /asset/"$$OBJECT" "local/$$BUCKET/$$OBJECT"
        mc anonymous set download "local/$$BUCKET"
        echo "Ready: http://localhost:9000/$$BUCKET/$$OBJECT"

volumes:
  minio-data:
